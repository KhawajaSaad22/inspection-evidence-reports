name: Reports and Linux container
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: docker build -t inspection-reports .
      - run: docker run --rm inspection-reports python reports.py demo --output /tmp/demo
